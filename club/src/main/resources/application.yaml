app:
  api:
    base-path: /api/club

external:
  service:
    url: ${EXTERNAL_SERVICE_URL:http://localhost:8081}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/club_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml