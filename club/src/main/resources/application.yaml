app:
  api:
    base-path: /api/club

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/club_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true